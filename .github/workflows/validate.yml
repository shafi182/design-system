name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tokens (aliases + WCAG contrast, both palettes)
        run: python build/build.py --check
      - name: Build
        run: python build/build.py
      - name: Fail if dist is stale
        run: |
          git diff --exit-code dist/ || {
            echo "dist/ tidak sinkron dengan tokens/ — jalankan python build/build.py lalu commit."
            exit 1
          }

  deck:
    runs-on: ubuntu-latest
    needs: tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deck dependencies
        run: pip install python-pptx==1.0.2 pillow
      - name: Build both palettes
        run: |
          python build/photos.py
          for palette in professional adventurous; do
            python build/deck.py "$palette"
            python build/preview.py "$palette"
          done
      - name: Assert nine slides per palette
        run: |
          python - <<'PY'
          from pptx import Presentation
          for palette in ("professional", "adventurous"):
              prs = Presentation(f"examples/pitch-deck-{palette}.pptx")
              assert len(prs.slides) == 9, f"{palette}: {len(prs.slides)} slides"
              print(palette, len(prs.slides), "slides ok")
          PY
